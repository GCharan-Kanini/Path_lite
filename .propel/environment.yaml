stack: node-jest
install_cmd: npm install
syntax_cmd: find . -path ./node_modules -prune -o \( -name '*.js' -o -name '*.mjs'
  -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check
build_cmd: npm run build --if-present
test_cmd: JEST_JUNIT_OUTPUT_DIR=.propel npx jest --ci --reporters=default --reporters=jest-junit;
  cat .propel/junit.xml
test_selector: JEST_JUNIT_OUTPUT_DIR=.propel npx jest --ci {path} --reporters=default
  --reporters=jest-junit; cat .propel/junit.xml
dependency_file: package.json
runtime_version: '20'
